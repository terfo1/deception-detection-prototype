seed: 42
dataset:
  name: cit
  raw_dir: data/raw/cit
  file_pattern: "*.xlsx"
  recursive: false
  allow_missing_schema: true
preprocessing:
  mode: offline
  sort_by_timestamp: true
  validity_min: 0.5
  interpolate: true
  interpolation_limit: 5
  smoothing:
    method: rolling_mean
    window: 5
  normalization:
    kind: participant
  pupil_baseline:
    enabled: true
    fraction: 0.1
features:
  mode: sequence
  sequence_columns:
    - gaze_x
    - gaze_y
    - pupil
    - validity
  window_size: 64
  stride: 16
split:
  subject_independent: true
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
model:
  family: deep
  name: lstm
  input_dim: 4
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  num_classes: 2
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  output_dir: outputs
evaluation:
  positive_label: 1
