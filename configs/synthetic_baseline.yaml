seed: 42
dataset:
  name: synthetic
  n_participants: 24
  trials_per_participant: 8
  samples_per_trial: 128
preprocessing:
  mode: offline
  sort_by_timestamp: true
  validity_min: 0.5
  interpolate: true
  interpolation_limit: 5
  smoothing:
    method: rolling_mean
    window: 5
  normalization:
    kind: null
  pupil_baseline:
    enabled: true
    fraction: 0.1
features:
  mode: aggregated
split:
  subject_independent: true
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
model:
  family: baseline
  name: logistic_regression
training:
  output_dir: outputs/synthetic_demo
evaluation:
  positive_label: 1
