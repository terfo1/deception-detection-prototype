name: eye-tracking-assignment5
# Isolated local CI/CD lab: Jenkins -> Docker-in-Docker -> local registry -> k3s.
# Only Jenkins is published, and only on the loopback interface.
services:
  registry:
    image: registry:2.8.3
    volumes:
      - registry-data:/var/lib/registry
  docker:
    image: docker:27.3.1-dind
    privileged: true
    command: ["--insecure-registry=registry:5000"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker
    healthcheck:
      test: [CMD, docker, info]
      interval: 5s
      timeout: 5s
      retries: 30
  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    privileged: true
    command: ["server", "--disable=traefik", "--disable=metrics-server", "--tls-san=k3s",
              "--write-kubeconfig-mode=644"]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    tmpfs: [/run, /var/run]
    volumes:
      - ./k3s-registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      - k3s-data:/var/lib/rancher/k3s
      - k3s-kubeconfig:/output
  jenkins:
    build:
      context: ../..
      dockerfile: ci/jenkins/Dockerfile
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set a local password in ci/jenkins/.env}
      JENKINS_ANONYMOUS_READ: ${JENKINS_ANONYMOUS_READ:-true}
      RESEARCH_REPOSITORY: https://github.com/terfo1/deception-detection-prototype.git
      RESEARCH_BRANCH: ${RESEARCH_BRANCH:-main}
      # CD target inside this lab; empty value disables the stage.
      LAB_REGISTRY: registry:5000
      KUBECONFIG_SOURCE: /k3s/kubeconfig.yaml
      KUBE_API_SERVER: https://k3s:6443
      # Optional Docker Hub publication; also needs a Jenkins credential "dockerhub".
      DOCKERHUB_REPOSITORY: ${DOCKERHUB_REPOSITORY:-}
    volumes:
      - jenkins-home:/var/jenkins_home
      - docker-certs:/certs/client:ro
      - k3s-kubeconfig:/k3s:ro
    depends_on:
      docker:
        condition: service_healthy
      registry:
        condition: service_started
      k3s:
        condition: service_started
volumes:
  jenkins-home:
  docker-certs:
  docker-data:
  registry-data:
  k3s-data:
  k3s-kubeconfig:
