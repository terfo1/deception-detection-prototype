[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deception-detection-prototype"
version = "0.1.0"
description = "Research prototype for sequence modeling of deception-related eye-tracking data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.25",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/terfo1/deception-detection-prototype"
Repository = "https://github.com/terfo1/deception-detection-prototype"
Issues = "https://github.com/terfo1/deception-detection-prototype/issues"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["deep: tests that require the optional PyTorch dependency"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/train.py" = ["E402"]
