# Test deployment of the runtime image: one batch run of the synthetic demo.
# The CD stage substitutes __IMAGE__ and __REVISION__; no participant data is mounted.
apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-analysis
  namespace: eye-tracking-test
  labels:
    app.kubernetes.io/name: eye-tracking-analysis
    app.kubernetes.io/version: "__REVISION__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eye-tracking-analysis
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: analysis
          image: __IMAGE__
          imagePullPolicy: Always
          args: ["--output-dir", "/work/run"]
          env:
            - {name: MPLCONFIGDIR, value: /tmp/matplotlib}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: work, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
