name: CI and release

on:
  push:
    branches: [main, 'feature/assignment-3', 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python }} / pandas ${{ matrix.pandas }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            pandas: '>=2.1,<3'
          - python: '3.12'
            pandas: '>=3,<4'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and development dependencies
        run: python -m pip install -e '.[dev]' 'pandas${{ matrix.pandas }}'
      - name: Lint
        run: python -m ruff check .
      - name: Test core module
        run: python -m pytest -m 'not deep' --cov=src --cov-report=xml --junitxml=test-results/junit.xml
      - name: Run documented scientific demo
        run: python scripts/train.py --config configs/synthetic_baseline.yaml
      - name: Run Assignment 3 offline analysis demo
        run: python examples/eye_tracking_analysis_demo.py --output-dir outputs/assignment-3-ci
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python }}
          path: |
            test-results/
            coverage.xml
      - name: Upload demo metrics and figures
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-python-${{ matrix.python }}
          path: |
            outputs/synthetic_demo/
            outputs/assignment-3-ci/

  deep:
    name: Optional sequence models
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and development dependencies
        run: |
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,deep]'
      - name: Train and evaluate LSTM and TCN on tiny debug data
        run: python -m pytest -m deep --junitxml=test-results/deep.xml
      - name: Upload sequence test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-test-report
          path: test-results/

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  container:
    name: Docker build, tests and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build test image
        run: docker build --pull --target test --build-arg VCS_REF=$GITHUB_SHA -t eye-tracking-ci:actions .
      - name: Run shared quality gates
        run: |
          mkdir -p test-results
          docker create --name eye-ci eye-tracking-ci:actions
          status=0
          docker start -a eye-ci || status=$?
          docker cp eye-ci:/app/test-results/. test-results/
          docker rm eye-ci
          exit "$status"
      - name: Build runtime image and run synthetic analysis
        run: |
          docker build --target runtime --build-arg VCS_REF=$GITHUB_SHA -t eye-tracking:actions .
          docker create --name eye-smoke eye-tracking:actions --output-dir /app/outputs/smoke
          docker start -a eye-smoke
          docker cp eye-smoke:/app/outputs/smoke test-results/synthetic-smoke
          docker rm eye-smoke
          docker image inspect eye-tracking:actions > test-results/runtime-image.json
          git rev-parse HEAD > test-results/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification
          path: test-results/

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_RELEASE == 'true'
    needs: [core, deep, package, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - name: Publish tested package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
